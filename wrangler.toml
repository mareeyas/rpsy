name = "rpsy"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "rpsy"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "BattleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]
